name: Build for Android

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '21'
    - name: Get Latest Release
      id: release
      uses: pozetroninc/github-action-get-latest-release@master
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        ./gradlew :android:packageRelease
        ./gradlew --stop

    - name: Upload Logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: ${{ github.workspace }}/android/build/outputs/logs/

    - name: Check Output Exists
      run: ls -laR ${{ github.workspace }}/android/build/outputs/apk/

    # We skip the signing step entirely to keep the APK unsigned
    # - name: Sign APK
    #   id: sign_apk
    #   ... (Removed)

    - name: Rename Unsigned APK
      run: |
        # Gradle usually outputs 'app-release-unsigned.apk' or similar. 
        # We find any .apk in the release folder and rename it.
        cd android/build/outputs/apk/release/
        mv *-unsigned.apk bifrost_android_${{ steps.release.outputs.release }}_unsigned.apk

    - name: Upload APK Artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: Bifrost-Unsigned
        path: ${{ github.workspace }}/android/build/outputs/apk/release/bifrost_android_${{ steps.release.outputs.release }}_unsigned.apk

    - name: Upload Release APK to GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ github.workspace }}/android/build/outputs/apk/release/bifrost_android_${{ steps.release.outputs.release }}_unsigned.apk
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: false
        omitBodyDuringUpdate: true
        tag: ${{ steps.release.outputs.release }}
